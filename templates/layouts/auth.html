<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <link rel="stylesheet" href="{{asset "/static/app.css"}}">
  <link rel="icon" href="{{asset "/static/favicon.svg"}}" type="image/svg+xml">
  <script src="{{asset "/static/accounts.js"}}" defer></script>
  {{hoist "head"}}
</head>

<body class="auth">
  <main class="passport">
    <header class="passport-cover">
      <img class="passport-emblem" src="{{asset "/static/passenger.png"}}" width="56" height="56" alt="">
      <p class="passport-name">Passenger</p>
      <p class="passport-tagline">Your self-hosted password vault</p>
    </header>
    <div class="passport-page">
      {{slot "content"}}
    </div>
  </main>
</body>

</html>
