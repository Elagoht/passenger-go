<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="{{asset "/static/app.css"}}">
  <link rel="icon" href="{{asset "/static/favicon.svg"}}" type="image/svg+xml">
  <script src="{{asset "/static/session.js"}}" defer></script>
  <script src="{{asset "/static/accounts.js"}}" defer></script>
  {{hoist "head"}}
</head>

<body class="app" data-session-expires="{{.ExpiresAtMS}}">
  <div id="session-banner" class="session-banner" role="alert" hidden>
    <span data-session-message></span>
    <button type="button" data-session-extend>Extend</button>
    <button type="button" data-session-signout>Sign out</button>
  </div>
  <header class="site-header">
    <div>
      <a class="brand" href="/">
        <img src="{{asset "/static/passenger.png"}}" width="40" height="40" alt="">
        <span>Passenger</span>
      </a>
      <details class="site-nav">
        <summary aria-label="Menu"><span></span><span></span><span></span></summary>
        <nav>
          <a href="/">Accounts</a>
          <a href="/accounts/new">New</a>
          <a href="/generate">Generate</a>
          <a href="/import">Import</a>
          <a href="/export">Export</a>
          <a href="/settings/passphrase">Settings</a>
          <form id="logout-form" class="logout-form" method="post" action="/logout">
            {{csrfToken}}
            <button type="submit" class="logout-button">Logout</button>
          </form>
        </nav>
      </details>
    </div>
  </header>
  <main>
    {{slot "content"}}
  </main>
</body>

</html>
