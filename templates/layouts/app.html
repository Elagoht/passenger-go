<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <link rel="stylesheet" href="{{asset "/static/app.css"}}">
  <link rel="icon" href="{{asset "/static/favicon.svg"}}" type="image/svg+xml">
  <script src="{{asset "/static/session.js"}}" defer></script>
  <script src="{{asset "/static/accounts.js"}}" defer></script>
  {{hoist "head"}}
</head>

<body class="app" data-session-expires="{{.ExpiresAtMS}}" data-session-remaining="{{.RemainingMS}}">
  <a class="skip-link" href="#content">Skip to content</a>

  <header class="topbar">
    <a class="wordmark" href="/" aria-label="Passenger, all accounts">
      <img src="{{asset "/static/passenger.png"}}" width="28" height="28" alt="">
      <span>Passenger</span>
    </a>

    <nav class="topnav" aria-label="Main">
      <a href="/">Accounts</a>
      <a href="/generate">Generator</a>
      <details class="menu">
        <summary>More</summary>
        <div class="menu-panel">
          <a href="/import">Import</a>
          <a href="/export">Export</a>
          <a href="/settings/passphrase">Settings</a>
          <form id="logout-form" method="post" action="/logout">
            {{csrfToken}}
            <button type="submit" class="menu-signout">Sign out</button>
          </form>
        </div>
      </details>
    </nav>

    <a class="button button-primary topbar-new" href="/accounts/new">New account</a>
  </header>

  <main id="content">
    {{range flashes}}<p class="alert alert-{{.Kind}}" role="status">{{.Text}}</p>{{end}}
    {{slot "content"}}
  </main>

  <div id="session-banner" class="session-banner" role="alert" hidden>
    <p>
      <span data-session-message></span>
      <span class="session-error" data-session-error></span>
    </p>
    <div class="session-actions">
      <button type="button" class="button button-primary" data-session-extend>Stay signed in</button>
      <button type="button" class="button button-quiet" data-session-signout>Sign out</button>
    </div>
  </div>

  <div class="toast" role="status" aria-live="polite" data-toast hidden></div>
</body>

</html>
